<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Banking Shell</title>
  <base href="/" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="light" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="theme-color" content="#1a1a2e" />
  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
</head>
<body>
  <!-- .device-frame/.device-screen render the app inside a phone mockup on wide
       (desktop/demo) viewports; on narrow screens they're transparent pass-throughs.
       See the "Phone device frame" section in styles.scss. -->
  <div class="device-frame">
    <div class="device-screen">
      <app-root></app-root>
    </div>
  </div>
</body>
</html>
