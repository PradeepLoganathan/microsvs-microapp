<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banking Micro-Frontends Demo</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
  <div class="demo-layout phone-only">
    <!-- Phone Frame -->
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <!-- Header -->
        <header class="app-header">
          <span class="header-title">Banking</span>
        </header>

        <!-- Content Area -->
        <main id="app-content" class="app-content">
          <!-- Dynamically rendered by app.js -->
        </main>

        <!-- Tab Bar -->
        <nav id="tab-bar" class="tab-bar">
          <!-- Dynamically rendered by app.js -->
        </nav>
      </div>
    </div>

    <!-- Open Config link -->
    <div class="open-config-hint">
      <a href="config.html" target="_blank">Open Config Panel &rarr;</a>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts (order matters: mock-data first, then app) -->
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
