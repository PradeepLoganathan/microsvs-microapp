akka.javasdk {
  dev-mode { http-port = 8083 }
  agent {
    model-provider = openai
    openai {
      model-name = "gpt-4o-mini"
      api-key = ${?OPENAI_API_KEY}
    }
  }
}

# analysis mode: "heuristic" (default, no LLM needed) or "agent" (requires API key)
analysis.mode = "heuristic"
analysis.mode = ${?ANALYSIS_MODE}

akka.loglevel = "INFO"

# Cross-service URLs (override with env vars for deployed environments)
services {
  statement-url = "http://localhost:8082"
  statement-url = ${?STATEMENT_SERVICE_URL}
}
