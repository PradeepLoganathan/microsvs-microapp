<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Statement Details — Micro-App Test Harness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f5f8;
      min-height: 100vh;
    }
    header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    .status {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #2d2d3d;
    }
    .status.connected { color: #16c784; }
    .status.error { color: #ea3943; }
    .container {
      max-width: 800px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .info-bar {
      background: #fff;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      font-size: 13px;
      color: #555;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .info-bar strong { color: #1a1a2e; }
    #microapp-host {
      min-height: 200px;
    }
    .loading {
      text-align: center;
      padding: 48px;
      color: #92949c;
    }
    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e0e0e0;
      border-top-color: #0f3460;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      text-align: center;
      padding: 48px;
      color: #ea3943;
    }
  </style>
</head>
<body>
  <header>
    <h1>Statement Details — Micro-App Test Harness</h1>
    <span class="status" id="status">Checking...</span>
  </header>

  <div class="container">
    <div class="info-bar">
      <div><strong>Bundle:</strong> src/main/resources/www/statement-details/1.0.0/main.js</div>
      <div><strong>Element:</strong> &lt;mf-statement-details&gt;</div>
      <div><strong>Backend:</strong> <span id="backend-url">http://localhost:8082</span></div>
    </div>

    <div id="microapp-host">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading micro-app bundle...</p>
      </div>
    </div>
  </div>

  <script>
    const BUNDLE_PATH = '../src/main/resources/www/statement-details/1.0.0/main.js';
    const ELEMENT_TAG = 'mf-statement-details';
    const ACCOUNT_ID = 'acc-1001';
    const BACKEND_URL = 'http://localhost:8082';

    const statusEl = document.getElementById('status');
    const hostEl = document.getElementById('microapp-host');

    async function init() {
      // 1. Check if backend is reachable
      try {
        const resp = await fetch(`${BACKEND_URL}/accounts/${ACCOUNT_ID}/statements`, { mode: 'cors' });
        if (resp.ok) {
          statusEl.textContent = 'Backend connected';
          statusEl.className = 'status connected';
        } else {
          statusEl.textContent = `Backend ${resp.status}`;
          statusEl.className = 'status error';
        }
      } catch (e) {
        statusEl.textContent = 'Backend unreachable';
        statusEl.className = 'status error';
        console.warn('Backend check failed:', e.message);
      }

      // 2. Inject the real bundle
      try {
        await injectScript(BUNDLE_PATH);
        await waitForElement(ELEMENT_TAG);

        // 3. Render the custom element
        hostEl.innerHTML = '';
        const el = document.createElement(ELEMENT_TAG);
        el.setAttribute('account-id', ACCOUNT_ID);
        hostEl.appendChild(el);

        statusEl.textContent = 'Loaded';
        statusEl.className = 'status connected';
      } catch (err) {
        hostEl.innerHTML = `<div class="error-msg"><p>Failed to load micro-app</p><p>${err.message}</p></div>`;
        statusEl.textContent = 'Load failed';
        statusEl.className = 'status error';
      }
    }

    function injectScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.type = 'text/javascript';
        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
        document.head.appendChild(script);
      });
    }

    function waitForElement(tagName, timeoutMs = 10000) {
      if (customElements.get(tagName)) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error(`Timed out waiting for <${tagName}>`)), timeoutMs);
        customElements.whenDefined(tagName).then(() => { clearTimeout(timeout); resolve(); }).catch(reject);
      });
    }

    init();
  </script>
</body>
</html>
